name: Differential fuzz -- grad_hdr admission checks

# Fuzzes protocol/grad_parse.h (the parser every component ships) against a
# reference parser under libFuzzer + ASan for a bounded time; fails on any
# crash or verdict divergence. The loaded XDP program gets the same corpus in
# bpf-unit.yml. See fuzz/README.md.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate seed corpus
        run: python3 fuzz/generate_corpus.py

      - name: Build and run differential fuzzer (120s)
        run: fuzz/build_and_run_fuzz.sh 120
