# NetSum v2 benchmark: closed-loop noagg vs userspace vs XDP (generic,
# native when veth supports it, array mode) on three namespaces, plus the
# multi-tenant fairness sweep. Performance is reported, never gated; the run
# fails only on a functional error (a worker that did not finish, or a wrong
# sum). Artifact: netsum-bench-<run id>. Method: docs/DESIGN_NOTES.md §15.
name: Benchmark v2 (closed loop, three namespaces)

on:
  pull_request:
    paths:
      - "xdp_agg/**"
      - "userspace_agg/**"
      - "worker/**"
      - "paramserver/**"
      - "protocol/**"
      - "common/**"
      - "ctl/**"
      - "scripts/bench_v2.sh"
      - "scripts/bench_analyze.py"
      - "scripts/topo.sh"
      - "scripts/netsum_stats.py"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm gcc make libbpf-dev libelf-dev zlib1g-dev python3 iproute2 ethtool
          uname -a; nproc; lscpu | sed -n 's/^Model name:[ ]*//p'

      - name: Build
        run: |
          set -euo pipefail
          MULTIARCH=$(gcc -print-multiarch)
          make bpf BPF_CC="clang -D__x86_64__ -idirafter /usr/include/${MULTIARCH}"
          make all ctl

      - name: Run the benchmark
        run: |
          sudo -E env "PATH=$PATH" OUT=bench-out/v2 TP_TRIALS=8 TP_ROUNDS=4000 LAT_TRIALS=5 \
            LAT_ROUNDS=2000 FAIR_TRIALS=3 FAIR_ROUNDS=400 bash scripts/bench_v2.sh
          sudo chown -R "$(id -u):$(id -g)" bench-out

      - name: Run the wire v3 overhead benchmark (v3 at exponent 16 vs v2, same integers)
        run: |
          sudo -E env "PATH=$PATH" OUT=bench-out/v3 CONFIGS="useragg useragg-v3 xdp-generic xdp-generic-v3" \
            TP_TRIALS=8 TP_ROUNDS=4000 LAT_TRIALS=0 FAIR_TRIALS=0 bash scripts/bench_v2.sh
          sudo chown -R "$(id -u):$(id -g)" bench-out

      - name: Analyse
        if: always()
        run: |
          set -o pipefail
          sudo chown -R "$(id -u):$(id -g)" bench-out || true
          python3 scripts/bench_analyze.py bench-out/v2 bench-out/v2/summary | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -d bench-out/v3 ]; then python3 scripts/bench_analyze.py bench-out/v3 bench-out/v3/summary | tee -a "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netsum-bench-${{ github.run_id }}
          path: |
            bench-out/v2/*.csv
            bench-out/v2/environment.json
            bench-out/v2/summary/
            bench-out/v3/*.csv
            bench-out/v3/environment.json
            bench-out/v3/summary/
