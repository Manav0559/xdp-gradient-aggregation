# End-to-end scenarios against the real kernel: xdp_agg.o goes through the
# verifier, is attached to a veth with netsum-ctl, and real UDP traffic from a
# second network namespace exercises aggregation, admission, loss recovery,
# ACK retirement and the TTL sweeper. Every assertion checks exact counter
# deltas (netsum-ctl --json stats) or exact slot states (netsum-ctl --json slots).
# Topology and helpers: ci/lib.sh. Scenario list: docs/DESIGN_NOTES.md §Testing strategy.
name: XDP real-kernel load test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  xdp-loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Kernel
        run: uname -a; nproc

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm gcc make libbpf-dev libelf-dev zlib1g-dev python3 iproute2
          sudo modprobe veth || true
          sudo modprobe sch_netem || true

      - name: Build
        run: |
          set -euo pipefail
          MULTIARCH=$(gcc -print-multiarch)
          make bpf BPF_CC="clang -D__x86_64__ -idirafter /usr/include/${MULTIARCH}"
          make all ctl
          llvm-objdump -h xdp_agg/xdp_agg.o

      - name: Verifier evidence (both programs, via libbpf)
        run: |
          set -euo pipefail
          sudo ./bin/netsum-ctl --json verify --obj xdp_agg/xdp_agg.o | tee /tmp/verifier.json

      - name: netsum-ctl smoke test (attach, config, stats, sweep, detach on its own veth)
        run: sudo CTL=./bin/netsum-ctl bash ci/test_netsum_ctl.sh

      - name: Set up veth pair and namespace
        run: |
          set -euo pipefail
          sudo ip link add veth0 type veth peer name veth1
          sudo ip netns add ns1
          sudo ip link set veth1 netns ns1
          sudo ip addr add 10.200.1.1/24 dev veth0
          sudo ip link set veth0 up
          sudo ip netns exec ns1 ip addr add 10.200.1.2/24 dev veth1
          sudo ip netns exec ns1 ip link set veth1 up
          sudo ip netns exec ns1 ip link set lo up
          # Workers and the PS share ns1; aggregates bounce back with XDP_TX.
          sudo ip netns exec ns1 sysctl -qw net.ipv4.conf.veth1.rp_filter=0
          sudo ip netns exec ns1 sysctl -qw net.ipv4.conf.all.rp_filter=0

      - name: Attach with netsum-ctl and configure
        run: |
          set -euo pipefail
          source ci/lib.sh
          ctl_json attach --ifname veth0 --mode generic --obj xdp_agg/xdp_agg.o | tee /tmp/attach.json
          ip -d link show veth0 | tee /tmp/link_show_veth0.log
          VETH0_MAC=$(ip link show veth0 | awk '/link\/ether/ {print $2}')
          VETH1_MAC=$(in_ns1 ip link show veth1 | awk '/link\/ether/ {print $2}')
          echo "VETH0_MAC=$VETH0_MAC" >> "$GITHUB_ENV"
          echo "VETH1_MAC=$VETH1_MAC" >> "$GITHUB_ENV"
          echo "CFG=--ps-mac $VETH1_MAC --ps-ip 10.200.1.2 --ps-port 9000 --agg-mac $VETH0_MAC --agg-ip 10.200.1.1" >> "$GITHUB_ENV"
          ctl_json config --ps-mac "$VETH1_MAC" --ps-ip 10.200.1.2 --ps-port 9000 --agg-mac "$VETH0_MAC" --agg-ip 10.200.1.1

      - name: Start the parameter server (results to workers, ACKs to the aggregator)
        run: |
          set -euo pipefail
          sudo ip netns exec ns1 ./bin/paramserver --ack-to 10.200.1.1:9876 9000 agg > /tmp/ps.log 2>&1 &
          for i in $(seq 1 50); do grep -q listening /tmp/ps.log 2>/dev/null && break; sleep 0.1; done
          grep -q listening /tmp/ps.log

      - name: "Scenario A: a 3-worker round sums correctly through the kernel"
        run: |
          set -euo pipefail
          source ci/lib.sh
          send 100 0 3 0.25 1 4; send 100 1 3 0.25 1 4
          sleep 0.3
          slots_to /tmp/slots_a.json
          python3 ci/check_slot_present.py /tmp/slots_a.json 100 accumulating
          send 100 2 3 0.25 1 4
          sleep 1
          python3 ci/assert_paramserver.py /tmp/ps.log 100 require 3 0.75

      - name: "Scenario Q (G1): the PS's ACK retires the completed slot"
        run: |
          set -euo pipefail
          source ci/lib.sh
          stats_to /tmp/stats_q0.json
          for w in 0 1 2; do send 970 "$w" 3 1.0; done
          sleep 1
          stats_to /tmp/stats_q1.json; slots_to /tmp/slots_q.json
          python3 ci/assert_paramserver.py /tmp/ps.log 970 require 3 3.0
          python3 ci/check_slot_present.py /tmp/slots_q.json 970 absent
          python3 ci/check_stat.py /tmp/stats_q0.json /tmp/stats_q1.json --delta slot_completed=1 ack_seen=1 slot_retired_ack=1

      - name: "Scenario B: chunk_len mismatch between workers is rejected"
        run: |
          set -euo pipefail
          source ci/lib.sh
          send 101 0 2 1.0 1 4
          sleep 0.3
          in_ns1 python3 ci/send_raw_packet.py 10.200.1.1 9876 101 0 0 1 2 2 65536 65536
          sleep 1
          python3 ci/assert_paramserver.py /tmp/ps.log 101 forbid

      - name: "Scenario C: a truncated packet is dropped, not summed as stale bytes"
        run: |
          set -euo pipefail
          source ci/lib.sh
          send 102 1 2 1.0 1 4
          sleep 0.3
          in_ns1 python3 ci/send_raw_packet.py 10.200.1.1 9876 102 0 0 0 2 4
          sleep 1
          python3 ci/assert_paramserver.py /tmp/ps.log 102 forbid

      - name: "Scenario D: fan-in 0 and fan-in 1000 never create a slot"
        run: |
          set -euo pipefail
          source ci/lib.sh
          stats_to /tmp/stats_d0.json
          in_ns1 python3 ci/send_raw_packet.py 10.200.1.1 9876 103 0 0 0 0 1 65536
          in_ns1 python3 ci/send_raw_packet.py 10.200.1.1 9876 104 0 0 0 1000 1 65536
          sleep 1
          stats_to /tmp/stats_d1.json
          python3 ci/assert_paramserver.py /tmp/ps.log 103 forbid
          python3 ci/assert_paramserver.py /tmp/ps.log 104 forbid
          python3 ci/check_stat.py /tmp/stats_d0.json /tmp/stats_d1.json --delta rej_num_workers=2 slot_created=0

      - name: "Scenario E: a missing config drops the completion and counts it"
        run: |
          set -euo pipefail
          source ci/lib.sh
          stats_to /tmp/stats_e0.json
          ctl_json config --delete
          send 105 0 2 0.5; send 105 1 2 0.5
          sleep 1
          stats_to /tmp/stats_e1.json
          python3 ci/assert_paramserver.py /tmp/ps.log 105 forbid
          python3 ci/check_stat.py /tmp/stats_e0.json /tmp/stats_e1.json --delta drop_no_config=1 slot_completed=1
          ctl_json config $CFG

      - name: "Scenario F: completion works again once config is restored"
        run: |
          set -euo pipefail
          source ci/lib.sh
          send 106 0 2 0.5; send 106 1 2 0.5
          sleep 1
          python3 ci/assert_paramserver.py /tmp/ps.log 106 require 2 1.0

      - name: "Scenario G: the per-job quota (drop policy) isolates a greedy job"
        run: |
          set -euo pipefail
          source ci/lib.sh
          stats_to /tmp/stats_g0.json
          ctl_json config $CFG --max-slots-per-job 2 --quota-policy drop
          send 900 0 2 0.5 3      # three rounds, worker 1 never sends: 2 admitted, 1 dropped
          sleep 0.5
          send 901 0 1 2.0
          sleep 1
          stats_to /tmp/stats_g1.json
          ctl_json jobs > /tmp/jobs_g.json
          python3 ci/check_job_quota.py /tmp/jobs_g.json 900 2
          python3 ci/check_stat.py /tmp/stats_g0.json /tmp/stats_g1.json --delta drop_quota=1
          python3 ci/assert_paramserver.py /tmp/ps.log 900 forbid
          python3 ci/assert_paramserver.py /tmp/ps.log 901 require 1 2.0
          ctl_json config $CFG

      - name: "Scenario H-legacy: 20% netem loss, redundant one-shot sends"
        run: |
          set -euo pipefail
          source ci/lib.sh
          in_ns1 tc qdisc add dev veth1 root netem loss 20%
          for w in 0 1 2; do for a in 1 2 3 4 5; do send 950 "$w" 3 1.0 || true; done; done
          sleep 1.5
          python3 ci/assert_paramserver.py /tmp/ps.log 950 require 3 3.0

      - name: "Scenario I-legacy: netem delay and reordering, redundant one-shot sends"
        run: |
          set -euo pipefail
          source ci/lib.sh
          in_ns1 tc qdisc change dev veth1 root netem delay 50ms 20ms reorder 25% 50%
          for w in 0 1 2; do for a in 1 2 3; do send 951 "$w" 3 1.0 || true; done; done
          sleep 2
          python3 ci/assert_paramserver.py /tmp/ps.log 951 require 3 3.0
          in_ns1 tc qdisc del dev veth1 root

      - name: "Scenario J2: a lost contribution is flushed by the sweeper, then recovered by retransmission"
        run: |
          set -euo pipefail
          source ci/lib.sh
          stats_to /tmp/stats_j0.json
          T0=$(date +%s%N)
          # Worker 2's first transmission is lost. TTL 1 s < RTO 1.5 s < 2 x TTL:
          # the sweeper flushes {0,1} at ~1.1 s and the slot is still FLUSHED
          # when the retransmissions arrive at ~1.5 s, so worker 2's resend
          # reaches the PS as a FALLBACK and completes the round there.
          for w in 0 1; do reliable_bg 952 "$w" 3 1 64 --rto-ms 1500; done
          reliable_bg 952 2 3 1 64 --rto-ms 1500 --drop-every 1
          sudo ./bin/netsum-ctl --pin /sys/fs/bpf/netsum sweep --ttl-ms 1000 --interval-ms 100 --duration-ms 3500 > /tmp/sweep_j2.log &
          SWEEP=$!
          wait $(jobs -p | grep -v "^$SWEEP$") 2>/dev/null || true
          wait $SWEEP || true
          sleep 0.5
          cat /tmp/sweep_j2.log
          stats_to /tmp/stats_j1.json; slots_to /tmp/slots_j2.json
          check_reliable 952 3 1
          grep -E "^\[partial\] job=952 round=0 chunk=0 have=2/3$" /tmp/ps.log
          python3 ci/assert_paramserver.py /tmp/ps.log 952 require 3 1.5
          python3 ci/check_slot_present.py /tmp/slots_j2.json 952 absent
          python3 - <<'PY'
          import sys; sys.path.insert(0, "ci"); import netsum_bpf_json as n
          a, b = n.stats("/tmp/stats_j0.json"), n.stats("/tmp/stats_j1.json")
          d = {k: b[k] - a.get(k, 0) for k in b if b[k] != a.get(k, 0)}
          print("J2 counter deltas:", d)
          # >= 1, not == 1: a late RESEND from worker 0 or 1 can reopen the key after the
          # ACK, and the sweeper then flushes that slot too (the PS re-sends the result).
          assert d.get("slot_flushed_partial", 0) >= 1, d
          assert d.get("tx_fallback", 0) >= 1 and d.get("slot_retired_ack", 0) >= 1, d
          PY
          echo "J2 timeline (PS log order):"; grep -nE "job=952" /tmp/ps.log
          echo "elapsed: $(( ($(date +%s%N) - T0) / 1000000 )) ms"

      - name: "Scenario K (C2): worker_id beyond fan-in never completes a round"
        run: |
          set -euo pipefail
          source ci/lib.sh
          stats_to /tmp/stats_k0.json
          for w in 10 11 12; do send 960 "$w" 3 1.0; done
          sleep 1
          stats_to /tmp/stats_k1.json
          python3 ci/assert_paramserver.py /tmp/ps.log 960 forbid
          python3 ci/check_stat.py /tmp/stats_k0.json /tmp/stats_k1.json --delta rej_worker_id=3 slot_created=0

      - name: "Scenario L (C3): fan-in disagreement is rejected; a fan-in-1 claim closes the round once"
        run: |
          set -euo pipefail
          source ci/lib.sh
          stats_to /tmp/stats_l0.json
          send 961 0 3 1.0; send 961 1 4 2.0; send 961 2 3 1.0
          sleep 1
          python3 ci/assert_paramserver.py /tmp/ps.log 961 forbid
          send 961 1 3 2.0
          sleep 1
          python3 ci/assert_paramserver.py /tmp/ps.log 961 require 3 4.0
          send 965 0 1 1.0
          sleep 0.3
          send 965 1 3 1.0; send 965 2 3 1.0
          sleep 1
          stats_to /tmp/stats_l1.json
          python3 ci/assert_paramserver.py /tmp/ps.log 965 require 1 1.0
          python3 ci/check_stat.py /tmp/stats_l0.json /tmp/stats_l1.json --delta num_workers_mismatch=1
          # 965's ACK retired the slot before workers 1 and 2 arrived, so they
          # open a 2-of-3 slot that the sweeper must reclaim (see Scenario O).

      - name: "Scenario M (C1): a late duplicate never leaves a slot behind"
        run: |
          set -euo pipefail
          source ci/lib.sh
          for w in 0 1 2; do send 962 "$w" 3 1.0; done
          sleep 0.5
          send 962 1 3 1.0                # late duplicate, after the ACK retired the slot
          sleep 0.3
          slots_to /tmp/slots_m0.json
          sudo ./bin/netsum-ctl --pin /sys/fs/bpf/netsum sweep --once --ttl-ms 0   # flush
          sudo ./bin/netsum-ctl --pin /sys/fs/bpf/netsum sweep --once --ttl-ms 0   # retire
          sleep 0.3
          slots_to /tmp/slots_m1.json
          python3 ci/check_slot_present.py /tmp/slots_m1.json 962 absent
          python3 ci/assert_paramserver.py /tmp/ps.log 962 require 3 3.0

      - name: "Scenario N (C4): accumulator overflow is flagged, never reported as a sum"
        run: |
          set -euo pipefail
          source ci/lib.sh
          stats_to /tmp/stats_n0.json
          for w in 0 1 2; do in_ns1 ./bin/worker 10.200.1.1 9876 963 "$w" 3 1 1 20000.0 20000.0 2>/dev/null; done
          sleep 1
          stats_to /tmp/stats_n1.json
          python3 ci/assert_paramserver.py /tmp/ps.log 963 forbid
          grep "\[overflow\] job=963" /tmp/ps.log
          python3 ci/check_stat.py /tmp/stats_n0.json /tmp/stats_n1.json --delta overflow=1 tx_aggregate=1

      - name: "Scenario H2 (G2): reliable workers complete every round under 20% loss"
        run: |
          set -euo pipefail
          source ci/lib.sh
          in_ns1 tc qdisc add dev veth1 root netem loss 20%
          for w in 0 1 2; do reliable_bg 980 "$w" 3 16 256 --rto-ms 50 --window 16; done
          wait
          in_ns1 tc qdisc del dev veth1 root
          check_reliable 980 3 64
          python3 - <<'PY'
          import json
          resent = sum(json.loads(open(f"/tmp/rw-980-{w}.json").read().strip().splitlines()[-1])["resent"] for w in range(3))
          assert resent > 0, "20% loss but no retransmissions?"
          PY

      - name: "Scenario S (wire v3): reliable workers at exponent 40 sum 3e-6 exactly through XDP under 20% loss"
        run: |
          set -euo pipefail
          source ci/lib.sh
          stats_to /tmp/s-before.json
          in_ns1 tc qdisc add dev veth1 root netem loss 20%
          for w in 0 1 2; do reliable_bg 996 "$w" 3 8 256 --rto-ms 50 --window 16 --fixed 3e-6 --frac-bits 40; done
          wait
          in_ns1 tc qdisc del dev veth1 root
          check_reliable 996 3 32
          stats_to /tmp/s-after.json
          python3 - <<'PY'
          import json
          b, a = json.load(open("/tmp/s-before.json")), json.load(open("/tmp/s-after.json"))
          d = {k: a.get(k, 0) - b.get(k, 0) for k in a if isinstance(a[k], int)}
          assert d["scale_mismatch"] == 0 and d["accepted"] > 0, d
          print("PASS: v3 at e=40 through the kernel:", {k: v for k, v in d.items() if v})
          PY

      - name: "Scenario S2 (wire v3): a saturated chunk is retried at a lower exponent through XDP"
        run: |
          set -euo pipefail
          source ci/lib.sh
          stats_to /tmp/s2-before.json
          for w in 0 1 2; do reliable_bg 997 "$w" 3 4 256 --rto-ms 50 --window 16 --fixed 1.0 --frac-bits 31; done
          wait
          check_reliable 997 3 16
          stats_to /tmp/s2-after.json
          python3 - <<'PY'
          import json
          for w in range(3):
              r = json.loads(open(f"/tmp/rw-997-{w}.json").read().strip().splitlines()[-1])
              assert r["retried_chunks"] == 16 and r["overflow_results"] == 16, r
          b, a = json.load(open("/tmp/s2-before.json")), json.load(open("/tmp/s2-after.json"))
          d = {k: a.get(k, 0) - b.get(k, 0) for k in a if isinstance(a[k], int)}
          assert d["overflow"] >= 16 and d["scale_mismatch"] == 0, d
          print("PASS: every saturated chunk came back OVERFLOW from the kernel and was retried at e=23:", {k: v for k, v in d.items() if v})
          PY

      - name: "Scenario I2 (G2): reliable workers complete every round under delay and reordering"
        run: |
          set -euo pipefail
          source ci/lib.sh
          in_ns1 tc qdisc add dev veth1 root netem delay 20ms 10ms reorder 25% 50%
          for w in 0 1 2; do reliable_bg 981 "$w" 3 16 256 --rto-ms 200 --window 16; done
          wait
          in_ns1 tc qdisc del dev veth1 root
          check_reliable 981 3 64

      - name: "Scenario G2 (G3): quota policy fallback sends a greedy job's excess round to the PS instead of dropping it"
        run: |
          set -euo pipefail
          source ci/lib.sh
          stats_to /tmp/stats_g2a.json
          ctl_json config $CFG --max-slots-per-job 2 --quota-policy fallback
          send 910 0 2 0.5 3      # rounds 0-1 aggregate in-network; round 2 is over quota
          send 910 1 2 0.5 3
          sleep 1
          stats_to /tmp/stats_g2b.json
          for r in 0 1 2; do grep -E "^\[complete\] job=910 round=$r chunk=0 " /tmp/ps.log; done
          python3 ci/check_stat.py /tmp/stats_g2a.json /tmp/stats_g2b.json --delta fallback_quota=1 tx_fallback=2 drop_quota=0 tx_aggregate=2
          ctl_json config $CFG

      - name: "Scenario P: array mode (ATP-style aggregator pool) end to end"
        run: |
          set -euo pipefail
          source ci/lib.sh
          stats_to /tmp/stats_p0.json
          ctl_json config $CFG --slot-mode array
          for w in 0 1; do reliable_bg 990 "$w" 2 8 256 --rto-ms 100; done
          wait
          stats_to /tmp/stats_p1.json; ctl_json slots > /tmp/slots_p.json
          check_reliable 990 2 32
          python3 ci/check_stat.py /tmp/stats_p0.json /tmp/stats_p1.json --delta slot_completed=32 tx_aggregate=32
          python3 -c "import json; d=json.load(open('/tmp/slots_p.json')); assert all(s['state'] != 'accumulating' for s in d), d"
          ctl_json config $CFG

      - name: "Scenario R (C13 on the kernel path): lost results are recovered through XDP"
        run: |
          set -euo pipefail
          source ci/lib.sh
          stats_to /tmp/r0.json
          # Every 4th result a worker receives is discarded, so only results
          # are lost (gradients and ACKs are untouched). The worker's RESEND
          # then hits a COMPLETED slot (XDP re-sends the aggregate) or, after
          # the ACK retired it, re-opens the key and flushes it to the PS,
          # which re-sends the stored result.
          for w in 0 1 2; do reliable_bg 998 "$w" 3 8 256 --rto-ms 50 --window 16 --drop-result-every 4; done
          wait
          sleep 0.5
          stats_to /tmp/r1.json; slots_to /tmp/slots_r.json
          check_reliable 998 3 32
          python3 ci/check_slot_present.py /tmp/slots_r.json 998 no-accumulating
          python3 - <<'PY'
          import json, re, sys
          sys.path.insert(0, "ci"); import netsum_bpf_json as n
          dropped = sum(json.loads(open(f"/tmp/rw-998-{w}.json").read().strip().splitlines()[-1])["dropped_rx"] for w in range(3))
          assert dropped >= 3, f"expected lost results, got {dropped}"
          a, b = n.stats("/tmp/r0.json"), n.stats("/tmp/r1.json")
          d = {k: b[k] - a.get(k, 0) for k in b if b[k] != a.get(k, 0)}
          recovered = d.get("tx_result_resend", 0) + d.get("slot_flushed_partial", 0)
          assert recovered >= 1, f"no recovery went through the XDP program: {d}"
          assert d.get("slot_completed", 0) >= 32, d
          done = re.findall(r"^\[complete\] job=998 round=(\d+) chunk=(\d+) ", open("/tmp/ps.log").read(), re.M)
          assert len(done) == 32 and len(set(done)) == 32, f"each key must complete exactly once at the PS: {len(done)}"
          print(f"PASS: {dropped} results lost, all recovered exactly; kernel deltas:", d)
          PY

      - name: "Scenario R2 (C13, array mode): lost results are recovered with the aggregator pool"
        run: |
          set -euo pipefail
          source ci/lib.sh
          stats_to /tmp/r2a.json
          ctl_json config $CFG --slot-mode array
          for w in 0 1 2; do reliable_bg 999 "$w" 3 8 256 --rto-ms 50 --window 16 --drop-result-every 4; done
          wait
          sleep 0.5
          stats_to /tmp/r2b.json; ctl_json slots > /tmp/slots_r2.json
          ctl_json config $CFG
          check_reliable 999 3 32
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "ci"); import netsum_bpf_json as n
          dropped = sum(json.loads(open(f"/tmp/rw-999-{w}.json").read().strip().splitlines()[-1])["dropped_rx"] for w in range(3))
          assert dropped >= 3, f"expected lost results, got {dropped}"
          a, b = n.stats("/tmp/r2a.json"), n.stats("/tmp/r2b.json")
          d = {k: b[k] - a.get(k, 0) for k in b if b[k] != a.get(k, 0)}
          assert d.get("tx_result_resend", 0) + d.get("slot_flushed_partial", 0) >= 1, d
          s = json.load(open("/tmp/slots_r2.json"))
          assert all(x["state"] != "accumulating" for x in s if x.get("job_id") == 999), s
          print(f"PASS: array mode, {dropped} results lost, all recovered; kernel deltas:", d)
          PY

      - name: "Scenario O (C1 hygiene): the TTL sweeper leaves no slot behind"
        run: |
          set -euo pipefail
          source ci/lib.sh
          slots_to /tmp/slots_o0.json
          echo "before sweeping:"; cat /tmp/slots_o0.json
          sudo ./bin/netsum-ctl --pin /sys/fs/bpf/netsum sweep --once --ttl-ms 0   # flush ACCUMULATING
          sudo ./bin/netsum-ctl --pin /sys/fs/bpf/netsum sweep --once --ttl-ms 0   # retire FLUSHED/COMPLETED
          sleep 0.5
          sudo ./bin/netsum-ctl --pin /sys/fs/bpf/netsum sweep --once --ttl-ms 0   # any re-opened by late ACKs
          slots_to /tmp/slots_o1.json
          python3 -c "import json; d=json.load(open('/tmp/slots_o1.json')); assert d == [], d; print('PASS: slot_map empty')"
          ctl_json jobs | python3 -c "import json,sys; d=json.load(sys.stdin); assert all(j['concurrent_slots']==0 for j in d), d; print('PASS: no charged quota left', d)"

      - name: Collect final evidence
        if: always()
        run: |
          set +e
          source ci/lib.sh
          cat /tmp/ps.log
          stats_to /tmp/stats_final.json; cat /tmp/stats_final.json
          slots_to /tmp/slots_final.json; cat /tmp/slots_final.json
          exit 0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdp-loadtest-evidence
          if-no-files-found: ignore
          path: |
            /tmp/verifier.json
            /tmp/attach.json
            /tmp/link_show_veth0.log
            /tmp/ps.log
            /tmp/stats_*.json
            /tmp/slots_*.json
            /tmp/jobs_*.json
            /tmp/sweep_*.log
            /tmp/rw-*.json

      - name: Tear down
        if: always()
        run: |
          set +e
          sudo pkill -f bin/paramserver
          sudo ./bin/netsum-ctl --pin /sys/fs/bpf/netsum detach --ifname veth0 --unpin
          sudo ip netns del ns1
          sudo ip link del veth0
          exit 0
