name: XDP real-kernel load test

# Closes the single biggest open gap in this repo: xdp_agg/xdp_agg.c has
# only ever been compiled to BPF bytecode with `clang -target bpf` on a
# macOS dev machine (codegen success) -- it has never been run through a
# real Linux kernel's in-kernel BPF *verifier*, which proves categorically
# stronger properties (pointer-provenance bounds, loop-termination, map
# safety) that codegen alone cannot check. ubuntu-latest GitHub Actions
# runners are real Linux boxes with a real verifier -- this workflow loads
# xdp_agg.o onto a veth pair via that real verifier, sends real UDP
# gradient packets through it (including the exact adversarial inputs an
# earlier adversarial code review found real bugs in), and asserts on the
# real, measured result -- not a simulation of one.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  xdp-loadtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show real kernel + verifier evidence environment
        run: |
          uname -a
          cat /proc/version

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm gcc libbpf-dev libelf-dev python3 iproute2
          sudo modprobe veth || true
          sudo modprobe sch_netem || true  # netem qdisc for the loss/reorder sweep, below
          sudo apt-get install -y bpftool || \
            sudo apt-get install -y linux-tools-common linux-tools-generic "linux-tools-$(uname -r)" || true
          # Gotcha: Ubuntu's /usr/sbin/bpftool is a wrapper script that gates
          # any kernel-interacting subcommand (prog load, map dump, ...)
          # behind an EXACT `uname -r` directory match under
          # /usr/lib/linux-tools/<version>/bpftool, but silently still runs
          # harmless subcommands like `version` even when that match fails
          # (this runner's actual running kernel string doesn't line up
          # with the archive package's directory name, a real, observed
          # mismatch on this exact GitHub-hosted runner image -- NOT a
          # hypothetical). Resolve and use the real binary directly,
          # bypassing that wrapper's gate, for every subsequent step.
          REAL_BPFTOOL=""
          for f in "/usr/lib/linux-tools/$(uname -r)/bpftool" /usr/lib/linux-tools/*/bpftool; do
            if [ -x "$f" ]; then REAL_BPFTOOL="$f"; break; fi
          done
          if [ -z "$REAL_BPFTOOL" ]; then
            echo "FATAL: no real bpftool binary found under /usr/lib/linux-tools/*"
            exit 1
          fi
          echo "resolved real bpftool binary: $REAL_BPFTOOL"
          sudo "$REAL_BPFTOOL" version
          echo "BPFTOOL=$REAL_BPFTOOL" >> "$GITHUB_ENV"

      - name: Build BPF object (real verifier target) and userspace binaries
        run: |
          # Plain `clang -target bpf` on Linux doesn't know the host's
          # multiarch include path, so glibc's stdint.h -> bits/libc-header-
          # start.h (which lives under /usr/include/<triplet>/, not
          # /usr/include/ directly) fails to resolve. -idirafter fixes that.
          # Second-order issue once that resolves: glibc's gnu/stubs.h picks
          # its 32- vs 64-bit stub header based on whether __x86_64__ is
          # defined, which clang does NOT define for the freestanding "bpf"
          # target (correctly -- it isn't x86_64) -- so it falls into the
          # 32-bit branch, which needs gnu/stubs-32.h, not installed on a
          # 64-bit-only runner. -D__x86_64__ is a preprocessor-only define
          # here (it does not change actual BPF codegen/ISA, only which
          # glibc header branch is textually selected) that makes it take
          # the 64-bit branch instead, which does exist and matches the
          # 64-bit int/long/pointer widths the BPF VM actually uses.
          MULTIARCH=$(gcc -print-multiarch)
          echo "host multiarch: $MULTIARCH"
          make bpf BPF_CC="clang -D__x86_64__ -idirafter /usr/include/${MULTIARCH}"
          make
          llvm-objdump -h xdp_agg/xdp_agg.o
          ls -la xdp_agg/xdp_agg.o bin/

      - name: Build config-map loader helper (libbpf bpf_obj_get/bpf_map_update_elem)
        run: |
          gcc -O2 -Wall -Wextra -o /tmp/netsum_cfg_loader ci/netsum_cfg_loader.c -lbpf
          /tmp/netsum_cfg_loader 2>&1 | head -1 || true  # prints usage, exit 1 expected here

      - name: Set up veth pair + network namespace (real wire, not loopback)
        run: |
          set -euo pipefail
          # See the workflow header: veth0 stays in the root netns (XDP is
          # attached here); veth1 moves into ns1. Sending FROM ns1 TO
          # veth0's address genuinely transmits over the wire instead of
          # short-circuiting via loopback delivery, which is what makes
          # this a real ingress test of the XDP hook.
          sudo ip link add veth0 type veth peer name veth1
          sudo ip netns add ns1
          sudo ip link set veth1 netns ns1
          sudo ip addr add 10.200.1.1/24 dev veth0
          sudo ip link set veth0 up
          sudo ip netns exec ns1 ip addr add 10.200.1.2/24 dev veth1
          sudo ip netns exec ns1 ip link set veth1 up
          sudo ip netns exec ns1 ip link set lo up
          # This minimal test topology puts BOTH the sending worker and the
          # receiving paramserver inside ns1 (see workflow header), which
          # means the completed/forwarded packet xdp_agg.c retargets ends
          # up with saddr == daddr == 10.200.1.2 -- it only ever rewrites
          # iph->daddr, never iph->saddr, which is correct for a REAL
          # deployment (a real parameter server has a genuinely different
          # IP than any worker) but means this specific test topology's
          # loopback-shaped traffic needs the kernel's default
          # "martian packet" protections (accept_local=0, rp_filter)
          # relaxed on veth1, or the completed packet gets silently
          # dropped by the IP stack for looking spoofed -- not an
          # xdp_agg.c bug, a consequence of this test intentionally
          # colocating both endpoints in one namespace.
          sudo ip netns exec ns1 sysctl -qw net.ipv4.conf.veth1.accept_local=1
          sudo ip netns exec ns1 sysctl -qw net.ipv4.conf.veth1.rp_filter=0
          sudo ip netns exec ns1 sysctl -qw net.ipv4.conf.all.rp_filter=0
          echo "--- veth0 (root ns) ---"
          ip addr show veth0
          echo "--- veth1 (ns1) ---"
          sudo ip netns exec ns1 ip addr show veth1

      - name: Load xdp_agg.o through the real kernel verifier (capture the log)
        run: |
          set -euo pipefail
          sudo mkdir -p /sys/fs/bpf/netsum
          set +e
          sudo "$BPFTOOL" -d prog load xdp_agg/xdp_agg.o /sys/fs/bpf/netsum/prog \
              type xdp pinmaps /sys/fs/bpf/netsum > /tmp/verifier.log 2>&1
          LOAD_RC=$?
          set -e
          echo "================ verifier / loader log (rc=$LOAD_RC) ================"
          cat /tmp/verifier.log
          echo "======================================================================="
          echo "--- dmesg tail (extra evidence, verifier messages sometimes land here too) ---"
          sudo dmesg | tail -n 60 > /tmp/dmesg_after_load.log || true
          cat /tmp/dmesg_after_load.log || true
          if [ $LOAD_RC -ne 0 ]; then
            echo "FAIL: the real Linux BPF verifier rejected xdp_agg.o -- see log above"
            exit 1
          fi
          echo "--- bpftool prog show (loaded_at/tag/xlated+jited sizes = proof it's really loaded) ---"
          sudo "$BPFTOOL" prog show pinned /sys/fs/bpf/netsum/prog | tee /tmp/prog_show.log
          echo "--- pinned maps ---"
          sudo ls -la /sys/fs/bpf/netsum

      - name: Attach the verified program to veth0's real ingress path
        run: |
          set -euo pipefail
          if sudo ip link set dev veth0 xdpgeneric pinned /sys/fs/bpf/netsum/prog 2>/tmp/attach.log; then
            echo "attached in xdpgeneric (SKB) mode"
            echo "XDP_MODE=xdpgeneric" >> "$GITHUB_ENV"
          else
            echo "xdpgeneric attach failed:"; cat /tmp/attach.log
            echo "falling back to plain 'xdp' (auto-negotiates generic if native unsupported)"
            sudo ip link set dev veth0 xdp pinned /sys/fs/bpf/netsum/prog
            echo "XDP_MODE=xdp" >> "$GITHUB_ENV"
          fi
          ip -d link show veth0 | tee /tmp/link_show_veth0.log

      - name: Populate config_map with veth1's real MAC/IP + paramserver port
        run: |
          set -euo pipefail
          VETH1_MAC=$(sudo ip netns exec ns1 ip link show veth1 | awk '/link\/ether/ {print $2}')
          echo "veth1 MAC: $VETH1_MAC"
          echo "VETH1_MAC=$VETH1_MAC" >> "$GITHUB_ENV"
          # NETSUM_PORT (9876) is fixed and is where `worker` sends gradient
          # traffic TO (filtered on by xdp_agg.c itself); ps_port here is the
          # separate, configurable port the COMPLETED/forwarded packet gets
          # retargeted to, which is where `paramserver` listens below.
          sudo /tmp/netsum_cfg_loader /sys/fs/bpf/netsum/config_map "$VETH1_MAC" 10.200.1.2 9000
          sudo "$BPFTOOL" map dump pinned /sys/fs/bpf/netsum/config_map

      - name: Start paramserver inside ns1 (receives XDP_TX'd completions)
        run: |
          set -euo pipefail
          sudo ip netns exec ns1 ./bin/paramserver 9000 agg > /tmp/ps.log 2>&1 &
          disown || true
          for i in $(seq 1 50); do
            grep -q "listening" /tmp/ps.log 2>/dev/null && break
            sleep 0.1
          done
          grep -q "listening" /tmp/ps.log || { echo "paramserver never became ready"; cat /tmp/ps.log; exit 1; }
          cat /tmp/ps.log

      - name: "Scenario A: real multi-worker round completes and sums correctly through the real kernel"
        run: |
          set -euo pipefail
          sudo ip netns exec ns1 ./bin/worker 10.200.1.1 9876 100 0 3 1 4 1.0 0.25
          sudo ip netns exec ns1 ./bin/worker 10.200.1.1 9876 100 1 3 1 4 1.0 0.25
          sleep 0.3
          echo "--- slot_map after 2 of 3 contributions (expect ONE entry, not yet complete) ---"
          sudo "$BPFTOOL" map dump pinned /sys/fs/bpf/netsum/slot_map
          sudo ip netns exec ns1 ./bin/worker 10.200.1.1 9876 100 2 3 1 4 1.0 0.25
          sleep 1
          echo "--- slot_map after all 3 (expect EMPTY -- the completed slot is deleted) ---"
          sudo "$BPFTOOL" map dump pinned /sys/fs/bpf/netsum/slot_map
          echo "--- veth0 (root ns) counters after the round ---"
          ip -s link show veth0
          echo "--- veth1 (ns1) counters after the round ---"
          sudo ip netns exec ns1 ip -s link show veth1
          echo "--- paramserver log so far ---"
          cat /tmp/ps.log
          python3 ci/assert_paramserver.py /tmp/ps.log 100 require 3 0.75

      - name: "Scenario B (adversarial): chunk_len mismatch between workers is rejected, not silently summed"
        run: |
          set -euo pipefail
          # Regression test for the critical out-of-bounds-write finding
          # xdp_agg.c's header comment documents: worker 0 establishes the
          # slot with chunk_len=4; worker 1's hand-crafted packet claims a
          # different chunk_len=2 for the SAME slot. The slot->chunk_len
          # check must reject it -- the slot must never complete.
          sudo ip netns exec ns1 ./bin/worker 10.200.1.1 9876 101 0 2 1 4 1.0 1.0
          sleep 0.3
          sudo ip netns exec ns1 python3 ci/send_raw_packet.py 10.200.1.1 9876 101 0 0 1 2 2 65536 65536
          sleep 1
          python3 ci/assert_paramserver.py /tmp/ps.log 101 forbid

      - name: "Scenario C (adversarial): truncated packet is dropped, not summed as stale bytes"
        run: |
          set -euo pipefail
          # Mirrors tests/test_correctness.py's
          # test_truncated_packet_not_summed_as_stale_bytes: a packet that
          # declares chunk_len=4 but carries zero payload bytes must fail
          # xdp_agg.c's (values + chunk_len) > data_end bounds check and be
          # dropped outright -- never reaching the slot/accumulate logic.
          sudo ip netns exec ns1 ./bin/worker 10.200.1.1 9876 102 1 2 1 4 1.0 1.0
          sleep 0.3
          sudo ip netns exec ns1 python3 ci/send_raw_packet.py 10.200.1.1 9876 102 0 0 0 2 4
          sleep 1
          python3 ci/assert_paramserver.py /tmp/ps.log 102 forbid

      - name: "Scenario D1 (adversarial): num_workers=0 is rejected before a slot is ever created"
        run: |
          set -euo pipefail
          sudo ip netns exec ns1 python3 ci/send_raw_packet.py 10.200.1.1 9876 103 0 0 0 0 1 65536
          sleep 1
          python3 ci/assert_paramserver.py /tmp/ps.log 103 forbid

      - name: "Scenario D2 (adversarial): oversized num_workers is rejected, not a permanent slot leak"
        run: |
          set -euo pipefail
          sudo ip netns exec ns1 python3 ci/send_raw_packet.py 10.200.1.1 9876 104 0 0 0 1000 1 65536
          sleep 1
          python3 ci/assert_paramserver.py /tmp/ps.log 104 forbid

      - name: "Scenario E (adversarial): missing config_map drops the completion AND counts it"
        run: |
          set -euo pipefail
          # Regression test for the "silent, unacknowledged data loss" fix:
          # temporarily empty config_map, then complete a real 2-worker
          # round. The completed aggregation must be dropped (never
          # forwarded -- paramserver sees nothing) AND
          # drop_stats[STAT_DROPPED_NO_CONFIG=0] must be bumped, proving
          # this isn't just silent packet loss on the real kernel path.
          sudo "$BPFTOOL" map delete pinned /sys/fs/bpf/netsum/config_map key hex 00 00 00 00
          sudo "$BPFTOOL" map dump pinned /sys/fs/bpf/netsum/config_map || echo "(confirmed: config_map is empty)"
          sudo ip netns exec ns1 ./bin/worker 10.200.1.1 9876 105 0 2 1 1 1.0 0.5
          sudo ip netns exec ns1 ./bin/worker 10.200.1.1 9876 105 1 2 1 1 1.0 0.5
          sleep 1
          python3 ci/assert_paramserver.py /tmp/ps.log 105 forbid
          sudo "$BPFTOOL" -j map dump pinned /sys/fs/bpf/netsum/drop_stats > /tmp/drop_stats.json
          cat /tmp/drop_stats.json
          python3 ci/check_drop_stat.py /tmp/drop_stats.json 0
          # Restore config for the recovery scenario below.
          sudo /tmp/netsum_cfg_loader /sys/fs/bpf/netsum/config_map "$VETH1_MAC" 10.200.1.2 9000

      - name: "Scenario F: recovery -- normal completion works again after config_map is restored"
        run: |
          set -euo pipefail
          sudo ip netns exec ns1 ./bin/worker 10.200.1.1 9876 106 0 2 1 1 1.0 0.5
          sudo ip netns exec ns1 ./bin/worker 10.200.1.1 9876 106 1 2 1 1 1.0 0.5
          sleep 1
          python3 ci/assert_paramserver.py /tmp/ps.log 106 require 2 1.0

      - name: "Scenario G: kernel-side fairness quota rejects a greedy job's excess slots, isolating a second job"
        run: |
          set -euo pipefail
          # Kernel port of tests/test_correctness.py's
          # test_fairness_quota_isolates_greedy_job, replayed against the
          # REAL loaded xdp_agg.o instead of only the userspace binary.
          # Set max_slots_per_job=2 in config_map (same ps_mac/ip/port as
          # before, plus the new field) -- the only place this quota is
          # configured from, per xdp_agg.c's new struct netsum_config field.
          sudo /tmp/netsum_cfg_loader /sys/fs/bpf/netsum/config_map "$VETH1_MAC" 10.200.1.2 9000 2
          sudo "$BPFTOOL" map dump pinned /sys/fs/bpf/netsum/config_map
          # Job 900: greedy job opening 3 concurrent incomplete slots
          # (rounds 0-2, only worker_id=0 of num_workers=2 ever sends, so
          # none of these slots ever completes/frees). With quota=2,
          # round 2's slot-creation attempt must be rejected outright.
          sudo ip netns exec ns1 ./bin/worker 10.200.1.1 9876 900 0 2 3 1 1.0 0.5
          sleep 0.5
          # Job 901: a different job_id's single, well-behaved,
          # self-contained round (num_workers=1) -- must complete normally,
          # unaffected by job 900 already sitting at its own quota.
          sudo ip netns exec ns1 ./bin/worker 10.200.1.1 9876 901 0 1 1 1 1.0 2.0
          sleep 1
          echo "--- slot_map (expect exactly 2 stuck entries for job 900, rounds 0 and 1) ---"
          sudo "$BPFTOOL" map dump pinned /sys/fs/bpf/netsum/slot_map
          echo "--- job_quota_map (expect job 900 concurrent_slots=2, the quota ceiling) ---"
          sudo "$BPFTOOL" -j map dump pinned /sys/fs/bpf/netsum/job_quota_map > /tmp/job_quota.json
          cat /tmp/job_quota.json
          python3 ci/check_job_quota.py /tmp/job_quota.json 900 2
          echo "--- drop_stats (expect STAT_DROPPED_FAIRNESS_QUOTA=1 bumped exactly once) ---"
          sudo "$BPFTOOL" -j map dump pinned /sys/fs/bpf/netsum/drop_stats > /tmp/drop_stats_quota.json
          cat /tmp/drop_stats_quota.json
          python3 ci/check_drop_stat.py /tmp/drop_stats_quota.json 1
          # Job 900 must never complete (worker 1 never sends); job 901 must.
          python3 ci/assert_paramserver.py /tmp/ps.log 900 forbid
          python3 ci/assert_paramserver.py /tmp/ps.log 901 require 1 2.0
          # Reset the quota to unlimited (0) so it doesn't affect the netem
          # sweep scenarios below, which use fresh job_ids of their own but
          # should otherwise see the same default (pre-Scenario-G) behavior.
          sudo /tmp/netsum_cfg_loader /sys/fs/bpf/netsum/config_map "$VETH1_MAC" 10.200.1.2 9000 0

      - name: "Scenario H: netem 20% loss -- a full round still completes correctly via redundant sends"
        run: |
          set -euo pipefail
          # netem is applied on veth1 (the ns1 end where worker/paramserver
          # run), per the workflow's own veth0(root)/veth1(ns1) split --
          # this genuinely perturbs traffic reaching/leaving the
          # XDP-attached veth0, not a no-op on the wrong interface.
          sudo ip netns exec ns1 tc qdisc add dev veth1 root netem loss 20%
          sudo ip netns exec ns1 tc qdisc show dev veth1
          # Experimental design: with a real, uncontrolled 20% per-packet
          # loss rate, a single send per worker would only complete
          # ~51% of the time (0.8^3 for 3 independent single-packet
          # sends). Rather than accept a flaky ~50% pass rate, each
          # worker's single round is sent 5 times (all 5 identical
          # packets land on the same slot; xdp_agg.c's seen_worker dedup
          # bitmap silently absorbs the duplicates that do arrive) --
          # per-worker delivery failure probability drops to 0.2^5 =
          # 0.00032, i.e. round failure probability across all 3 workers
          # is bounded by ~0.001, low enough not to flake CI while still
          # exercising the REAL netem-perturbed path.
          for worker_id in 0 1 2; do
            for attempt in 1 2 3 4 5; do
              sudo ip netns exec ns1 ./bin/worker 10.200.1.1 9876 950 "$worker_id" 3 1 1 1.0 1.0 || true
            done
          done
          sleep 1.5
          python3 ci/assert_paramserver.py /tmp/ps.log 950 require 3 3.0
          echo "--- veth1 (ns1) counters after the lossy round ---"
          sudo ip netns exec ns1 ip -s link show veth1

      - name: "Scenario I: netem delay+reorder -- a full round still completes correctly (sum is order-independent)"
        run: |
          set -euo pipefail
          # Swap the qdisc for delay+reorder: `reorder` on its own is a
          # documented netem no-op without a correlated `delay` term (a
          # reordered packet needs something to reorder AROUND), so this
          # is the standard idiom for exercising real packet reordering.
          sudo ip netns exec ns1 tc qdisc change dev veth1 root netem delay 50ms 20ms reorder 25% 50%
          sudo ip netns exec ns1 tc qdisc show dev veth1
          # Same redundant-send design as Scenario H (belt-and-suspenders
          # against any residual loss from the delay jitter); the actual
          # property under test here is that xdp_agg.c's slot/accumulate
          # logic is commutative in arrival order -- summing worker
          # contributions in whatever order they truly arrive, reordered
          # or not, must produce the same total.
          for worker_id in 0 1 2; do
            for attempt in 1 2 3; do
              sudo ip netns exec ns1 ./bin/worker 10.200.1.1 9876 951 "$worker_id" 3 1 1 1.0 1.0 || true
            done
          done
          sleep 2
          python3 ci/assert_paramserver.py /tmp/ps.log 951 require 3 3.0

      - name: "Scenario J (honest finding): a netem-dropped worker packet leaves its slot stuck forever -- no TTL"
        run: |
          set -euo pipefail
          # This is the actually-interesting, expected-to-be-real finding
          # this scenario exists to measure, not assert away: xdp_agg.c
          # has no TTL/eviction mechanism at all (see its header comment
          # and userspace_agg.c's, which explicitly call this out as
          # separate, out-of-scope follow-up work needing bpf_timer on a
          # 5.15+ kernel). A worker whose contribution is permanently lost
          # mid-round should leave its slot stuck in slot_map forever --
          # this proves that empirically against the REAL loaded program,
          # rather than leaving it a theoretical risk.
          #
          # Deterministic construction (not relying on netem's own random
          # loss rate to happen to hit the right packet, which would be
          # flaky): send workers 0 and 1 with netem CLEAN (loss 0%), then
          # switch netem to loss 100% for worker 2's single send -- that
          # packet is now genuinely, certainly dropped by netem itself
          # (not just "we chose not to send it"), simulating a real
          # dropped-worker-packet loss event. Then restore netem to clean.
          sudo ip netns exec ns1 tc qdisc change dev veth1 root netem loss 0%
          sudo ip netns exec ns1 ./bin/worker 10.200.1.1 9876 952 0 3 1 1 1.0 1.0
          sudo ip netns exec ns1 ./bin/worker 10.200.1.1 9876 952 1 3 1 1 1.0 1.0
          sleep 0.3
          sudo ip netns exec ns1 tc qdisc change dev veth1 root netem loss 100%
          sudo ip netns exec ns1 ./bin/worker 10.200.1.1 9876 952 2 3 1 1 1.0 1.0
          sleep 0.3
          sudo ip netns exec ns1 tc qdisc change dev veth1 root netem loss 0%
          sleep 1
          echo "--- paramserver log (job 952 must never appear -- its 3rd contribution never arrived) ---"
          python3 ci/assert_paramserver.py /tmp/ps.log 952 forbid
          echo "--- slot_map (measure, don't assume: confirm job 952's incomplete slot is STILL there) ---"
          sudo "$BPFTOOL" -j map dump pinned /sys/fs/bpf/netsum/slot_map > /tmp/slot_map_952.json
          cat /tmp/slot_map_952.json
          python3 ci/check_slot_present.py /tmp/slot_map_952.json 952 present
          # Teardown -- remove the netem qdisc so it doesn't outlive this
          # scenario (the netns is torn down at the end of the job anyway,
          # but doing it explicitly documents the impairment window).
          sudo ip netns exec ns1 tc qdisc del dev veth1 root || true

      - name: Collect final evidence (paramserver log, verifier log, map state)
        if: always()
        run: |
          set +e
          echo "--- full paramserver log ---"
          cat /tmp/ps.log
          echo "--- final drop_stats ---"
          sudo "$BPFTOOL" map dump pinned /sys/fs/bpf/netsum/drop_stats > /tmp/drop_stats_final.json 2>&1
          cat /tmp/drop_stats_final.json
          echo "--- final slot_map (Scenarios A-F/H/I complete or reject cleanly; Scenario G leaves 2 stuck job-900 entries -- fairness quota rejects admission, it does not evict; Scenario J leaves 1 stuck job-952 entry -- the documented, no-TTL leak) ---"
          sudo "$BPFTOOL" map dump pinned /sys/fs/bpf/netsum/slot_map > /tmp/slot_map_final.json 2>&1
          cat /tmp/slot_map_final.json
          exit 0

      - name: Upload verifier + run evidence as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdp-loadtest-evidence
          if-no-files-found: ignore
          path: |
            /tmp/verifier.log
            /tmp/dmesg_after_load.log
            /tmp/prog_show.log
            /tmp/attach.log
            /tmp/link_show_veth0.log
            /tmp/ps.log
            /tmp/drop_stats.json
            /tmp/drop_stats_final.json
            /tmp/slot_map_final.json
            /tmp/job_quota.json
            /tmp/drop_stats_quota.json
            /tmp/slot_map_952.json

      - name: Tear down netns/veth/pinned objects
        if: always()
        run: |
          set +e
          sudo pkill -f "bin/paramserver"
          sudo ip link set dev veth0 xdpgeneric off 2>/dev/null
          sudo ip link set dev veth0 xdp off 2>/dev/null
          sudo ip netns del ns1
          sudo ip link del veth0
          sudo rm -rf /sys/fs/bpf/netsum
          exit 0
