# Training demo: a small MLP trained with synchronous data-parallel SGD whose
# gradients travel through NetSum. Checks that every network path (noagg,
# userspace aggregation, XDP aggregation, XDP under 5% loss) returns a summed
# gradient bit-identical to the local quantized sum at every step.
# Artifact: train-demo-<run id> (examples/train_mlp/results/curves.csv).
name: Training demo (MLP through NetSum)

on:
  pull_request:
    paths:
      - "examples/**"
      - "xdp_agg/**"
      - "paramserver/**"
      - "userspace_agg/**"
      - "protocol/**"
      - ".github/workflows/train-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install and build
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm gcc make libbpf-dev libelf-dev zlib1g-dev python3 iproute2 ethtool
          sudo modprobe sch_netem || true
          MULTIARCH=$(gcc -print-multiarch)
          make bpf BPF_CC="clang -D__x86_64__ -idirafter /usr/include/${MULTIARCH}"
          make all ctl
          sudo bash scripts/topo.sh up

      - name: Train through every path
        run: |
          set -euo pipefail
          OUT=examples/train_mlp/results/curves.csv
          rm -f "$OUT"
          . scripts/train_paths.sh
          # local reference curves (no network)
          python3 examples/train_mlp/train.py --steps 200 --paths float,quant --out "$OUT"
          all_paths ""
          grep -h "steps whose summed gradient" /tmp/train-*.txt
          python3 - "$OUT" <<'PY'
          import csv, sys
          rows = list(csv.DictReader(open(sys.argv[1])))
          final = {r["config"]: r for r in rows if r["step"] == "200"}
          print({k: (v["loss"], v["accuracy"], v["retransmissions"]) for k, v in final.items()})
          net = [r for r in rows if r["bit_identical_to_quant"] != ""]
          assert net and all(r["bit_identical_to_quant"] == "1" for r in net), "a network path diverged from the local quantized sum"
          for cfg in ("noagg", "useragg", "xdp", "xdp-loss5"):
              assert final[cfg]["loss"] == final["quant"]["loss"], (cfg, final[cfg], final["quant"])
          assert float(final["quant"]["loss"]) < float([r for r in rows if r["config"] == "quant" and r["step"] == "0"][0]["loss"])
          assert int(final["xdp-loss5"]["retransmissions"]) > 0, "5% loss but no retransmissions"
          print("PASS: every network path is bit-identical to the local quantized all-reduce; loss decreased")
          PY

      - name: Train with small gradients (x1e-4) at a per-chunk exponent (wire v3)
        run: |
          set -euo pipefail
          OUT=examples/train_mlp/results/curves_scale1e-4.csv
          rm -f "$OUT"
          . scripts/train_paths.sh
          python3 examples/train_mlp/train.py --steps 200 --paths float,quant,adapt --grad-scale 1e-4 --out "$OUT"
          all_paths -v3 --grad-scale 1e-4 --net-format v3
          python3 -c "import json; assert json.load(open('/tmp/xdp-stats.json')).get('scale_mismatch') == 0"
          grep -h "steps whose summed gradient" /tmp/train-*-v3.txt
          python3 - "$OUT" <<'PY'
          import csv, sys
          rows = list(csv.DictReader(open(sys.argv[1])))
          final = {r["config"]: r for r in rows if r["step"] == "200"}
          print({k: (v["loss"], v["accuracy"], v["retransmissions"]) for k, v in final.items()})
          net = [r for r in rows if r["bit_identical_to_quant"] != ""]
          assert net and all(r["bit_identical_to_quant"] == "1" for r in net), "a network path diverged from the local adaptive sum"
          for cfg in ("noagg-v3", "useragg-v3", "xdp-v3", "xdp-loss5-v3"):
              assert final[cfg]["loss"] == final["adapt"]["loss"], (cfg, final[cfg], final["adapt"])
          assert int(final["xdp-loss5-v3"]["retransmissions"]) > 0, "5% loss but no retransmissions"
          fl, q, ad = (float(final[k]["accuracy"]) for k in ("float", "quant", "adapt"))
          assert ad >= fl - 0.01 and q < fl - 0.3, (fl, q, ad)
          print(f"PASS: gradients x1e-4: float {fl}, Q16.16 {q}, per-chunk exponent {ad}; every v3 network path bit-identical to it")
          PY

      - name: Upload curves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-demo-${{ github.run_id }}
          path: examples/train_mlp/results/curves*.csv
